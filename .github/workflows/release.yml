name: Release

# Builds installers for macOS (universal), Windows and Linux and publishes them
# to a GitHub Release with stable asset names, so download links never change:
#   https://github.com/ALutenko/GamePlatformLauncher/releases/latest/download/Lutarea-Launcher-macOS.dmg
#   …/Lutarea-Launcher-Windows-Setup.exe   …/Lutarea-Launcher-Windows.msi
#   …/Lutarea-Launcher-Linux.AppImage      …/Lutarea-Launcher-Linux.deb
#   …/manifest.json
#
# Trigger: push a tag `v*` (e.g. `git tag v0.2.0 && git push origin v0.2.0`)
# or run manually with a tag name. Builds are unsigned (see docs/RELEASE.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

env:
  VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://platform.lutarea.com' }}
  VITE_ASSET_BASE: ${{ vars.VITE_ASSET_BASE || '' }}
  VITE_STORE_URL: ${{ vars.VITE_STORE_URL || 'https://store.lutarea.com' }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --bundles deb,appimage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux deps (webkit2gtk 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - run: pnpm install --frozen-lockfile

      - name: tauri build
        run: pnpm tauri build ${{ matrix.args }}

      - name: Collect artifacts with stable names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          B="src-tauri/target"
          case "${{ matrix.name }}" in
            macOS)
              cp "$B/universal-apple-darwin/release/bundle/dmg/"*.dmg out/Lutarea-Launcher-macOS.dmg
              ;;
            Windows)
              cp "$B"/release/bundle/nsis/*-setup.exe out/Lutarea-Launcher-Windows-Setup.exe
              cp "$B"/release/bundle/msi/*.msi out/Lutarea-Launcher-Windows.msi
              ;;
            Linux)
              cp "$B"/release/bundle/appimage/*.AppImage out/Lutarea-Launcher-Linux.AppImage
              cp "$B"/release/bundle/deb/*.deb out/Lutarea-Launcher-Linux.deb
              ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write manifest.json
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          cd artifacts
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          size() { stat -c%s "$1"; }
          cat > manifest.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "signed": false,
            "assets": {
              "macos": { "url": "${BASE}/Lutarea-Launcher-macOS.dmg", "size": $(size Lutarea-Launcher-macOS.dmg), "sha256": "$(sha Lutarea-Launcher-macOS.dmg)" },
              "windows-setup": { "url": "${BASE}/Lutarea-Launcher-Windows-Setup.exe", "size": $(size Lutarea-Launcher-Windows-Setup.exe), "sha256": "$(sha Lutarea-Launcher-Windows-Setup.exe)" },
              "windows-msi": { "url": "${BASE}/Lutarea-Launcher-Windows.msi", "size": $(size Lutarea-Launcher-Windows.msi), "sha256": "$(sha Lutarea-Launcher-Windows.msi)" },
              "linux-appimage": { "url": "${BASE}/Lutarea-Launcher-Linux.AppImage", "size": $(size Lutarea-Launcher-Linux.AppImage), "sha256": "$(sha Lutarea-Launcher-Linux.AppImage)" },
              "linux-deb": { "url": "${BASE}/Lutarea-Launcher-Linux.deb", "size": $(size Lutarea-Launcher-Linux.deb), "sha256": "$(sha Lutarea-Launcher-Linux.deb)" }
            }
          }
          EOF
          cat manifest.json
          sha256sum Lutarea-Launcher-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Lutarea Launcher ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Installers are **unsigned** for now:
            - **macOS** — open the `.dmg`, drag the app to Applications; on first launch right‑click → *Open* (or allow it in System Settings → Privacy & Security).
            - **Windows** — SmartScreen may show "Windows protected your PC": *More info → Run anyway*.
            - **Linux** — `chmod +x Lutarea-Launcher-Linux.AppImage && ./Lutarea-Launcher-Linux.AppImage`, or `sudo dpkg -i Lutarea-Launcher-Linux.deb`.

            Checksums: `SHA256SUMS.txt` · machine‑readable: `manifest.json`.
          files: |
            artifacts/Lutarea-Launcher-macOS.dmg
            artifacts/Lutarea-Launcher-Windows-Setup.exe
            artifacts/Lutarea-Launcher-Windows.msi
            artifacts/Lutarea-Launcher-Linux.AppImage
            artifacts/Lutarea-Launcher-Linux.deb
            artifacts/manifest.json
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
